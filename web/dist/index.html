<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSwitch Dashboard</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-7xl mx-auto p-6 space-y-6"><header><h1 class="text-3xl font-bold">Virtual L2 Switch</h1><p class="text-slate-400">Real-time transport, bandwidth and DHCP monitoring</p></header><section class="grid grid-cols-2 md:grid-cols-5 gap-4" id="cards"></section><section class="bg-slate-900 rounded-xl p-4"><canvas id="bw" height="110"></canvas></section><section class="grid md:grid-cols-2 gap-6"><div class="bg-slate-900 rounded-xl p-4"><h2 class="font-semibold mb-3">Ports</h2><pre id="ports" class="text-sm text-slate-300"></pre></div><div class="bg-slate-900 rounded-xl p-4"><h2 class="font-semibold mb-3">DHCP Leases</h2><pre id="leases" class="text-sm text-slate-300 overflow-auto"></pre></div></section><section class="bg-slate-900 rounded-xl p-4"><h2 class="font-semibold mb-3">Network Emulation</h2><div class="flex flex-wrap gap-3 items-end mb-3"><label class="text-sm">Port <select id="emuPort" class="bg-slate-950 rounded p-2 text-sm"></select></label><label class="text-sm">Preset <select id="emuPreset" class="bg-slate-950 rounded p-2 text-sm"></select></label><button id="emuApply" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm">Apply</button><button id="emuRemove" class="px-4 py-2 rounded bg-rose-700 hover:bg-rose-600 text-sm">Remove</button><span id="emuMsg" class="text-slate-400 text-sm"></span></div><pre id="emuActive" class="text-sm text-slate-300 overflow-auto"></pre></section><section class="bg-slate-900 rounded-xl p-4"><h2 class="font-semibold mb-3">Configuration</h2><textarea id="config" class="w-full h-72 bg-slate-950 rounded p-3 font-mono text-sm"></textarea><button id="save" class="mt-3 px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500">Save configuration</button><span id="msg" class="ml-3 text-slate-400"></span></section></main><script>
const $=id=>document.getElementById(id);const labels=[],rx=[],tx=[];const chart=new Chart($('bw'),{type:'line',data:{labels,datasets:[{label:'RX bytes/s',data:rx},{label:'TX bytes/s',data:tx}]},options:{animation:false,responsive:true}});let last=null;function render(s){const vals=[['RX',s.rx_bytes],['TX',s.tx_bytes],['RX packets',s.rx_packets],['TX packets',s.tx_packets],['Ports',s.active_ports]];$('cards').innerHTML=vals.map(x=>`<div class="bg-slate-900 rounded-xl p-4"><div class="text-xs text-slate-400">${x[0]}</div><div class="text-xl font-bold">${Number(x[1]).toLocaleString()}</div></div>`).join('');if(last){rx.push(Math.max(0,s.rx_bytes-last.rx_bytes));tx.push(Math.max(0,s.tx_bytes-last.tx_bytes));labels.push(new Date().toLocaleTimeString());if(labels.length>30){labels.shift();rx.shift();tx.shift()}chart.update()}last=s}
async function refresh(){const [p,l,c]=await Promise.all([fetch('/api/v1/ports').then(r=>r.json()),fetch('/api/v1/leases').then(r=>r.json()),fetch('/api/v1/config').then(r=>r.json())]);$('ports').textContent=JSON.stringify(p,null,2);$('leases').textContent=JSON.stringify(l,null,2);if(document.activeElement!==$('config'))$('config').value=JSON.stringify(c,null,2)}$('save').onclick=async()=>{try{const c=JSON.parse($('config').value);await fetch('/api/v1/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});$('msg').textContent='Saved'}catch(e){$('msg').textContent=e.message}};const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/metrics');ws.onmessage=e=>render(JSON.parse(e.data));async function refreshEmu(){try{const[e,ports]=await Promise.all([fetch('/api/v1/emulation').then(r=>r.json()),fetch('/api/v1/emulation/ports').then(r=>r.json())]);const sel=$('emuPort');const cur=sel.value;sel.innerHTML=(ports||[]).map(k=>`<option${k===cur?' selected':''}>${k}</option>`).join('');const ps=$('emuPreset');if(!ps.dataset.init&&e.presets){ps.innerHTML=e.presets.map(n=>`<option>${n}</option>`).join('');ps.dataset.init='1'}$('emuActive').textContent=JSON.stringify({profiles:e.profiles||{},stats:e.stats||{}},null,2)}catch(x){}}$('emuApply').onclick=async()=>{const key=$('emuPort').value,preset=$('emuPreset').value;if(!key){$('emuMsg').textContent='no port selected';return}try{const r=await fetch('/api/v1/emulation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,preset})});if(!r.ok)throw new Error(await r.text());$('emuMsg').textContent='applied '+preset+' to '+key}catch(x){$('emuMsg').textContent=x.message}refreshEmu()};$('emuRemove').onclick=async()=>{const key=$('emuPort').value;if(!key)return;await fetch('/api/v1/emulation/'+encodeURIComponent(key),{method:'DELETE'});$('emuMsg').textContent='removed '+key;refreshEmu()};setInterval(refresh,2000);refresh();setInterval(refreshEmu,3000);refreshEmu();
</script></body></html>
